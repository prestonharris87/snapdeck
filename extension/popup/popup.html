<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="sd-head">
    <span class="sd-logo">▟</span>
    <span class="sd-title">Snapdeck</span>
    <span class="sd-count" id="count">0</span>
  </div>

  <label class="sd-label" for="note">Report note (optional)</label>
  <input id="note" class="sd-note" type="text" placeholder="e.g. GL posting screen issues" />

  <button id="add" class="sd-btn sd-primary">＋ Add screenshot</button>
  <div class="sd-row">
    <button id="save" class="sd-btn">✓ Save report</button>
    <button id="clear" class="sd-btn sd-ghost">Clear</button>
  </div>

  <div id="status" class="sd-status"></div>

  <script src="popup.js"></script>
</body>
</html>
